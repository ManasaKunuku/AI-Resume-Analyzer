{% extends "base.html" %}
{% block title %}Sign in | ResumeIQ{% endblock %}
{% block content %}
<div class="form-card"><h1>Welcome back</h1><p class="muted">Sign in to continue.</p>
<form method="post">
  <label>Email address<input type="email" name="email" required autocomplete="email"></label>
  <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn full">Sign in</button>
</form><p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>
{% endblock %}
