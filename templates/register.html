{% extends "base.html" %}
{% block title %}Create account | ResumeIQ{% endblock %}
{% block content %}
<div class="form-card"><h1>Create your account</h1><p class="muted">Save and revisit your resume analyses.</p>
<form method="post">
  <label>Full name<input name="name" required autocomplete="name"></label>
  <label>Email address<input type="email" name="email" required autocomplete="email"></label>
  <label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
  <button class="btn full">Create account</button>
</form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>
{% endblock %}
